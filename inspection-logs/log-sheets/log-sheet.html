<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log Sheet</title>

<link
  rel="stylesheet"
  href="log-sheet.css?v=20260821-item-insert-reorder3"
>

<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
  defer
></script>

<script
  src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
  defer
></script>

<script
  src="log-sheet-config.js?v=20260821-item-insert-reorder3"
  defer
></script>

<script
  src="log-sheet.js?v=20260821-item-insert-reorder3"
  defer
></script>

</head>

<body>
  <main class="log-sheet-app" id="logSheetApp">
    <header class="log-sheet-toolbar screen-only">
      <div class="log-sheet-toolbar__heading">
        <p>INSPECTION LOG SHEET</p>

        <h1 id="logSheetTitle">
          Log Sheet
        </h1>

        <span id="logSheetDescription">
          엑셀 양식을 준비하고 있습니다.
        </span>
      </div>

      <div class="log-sheet-toolbar__controls">
        <input type="hidden" id="logSheetDate">

        <label>
          <span>근무</span>

          <select id="logSheetShift">
            <option value="D/S">D/S</option>
            <option value="N/S">N/S</option>
          </select>
        </label>

        <label>
          <span>근무조</span>

          <select id="logSheetTeam">
            <option value="1">1조</option>
            <option value="2">2조</option>
            <option value="3">3조</option>
            <option value="4">4조</option>
          </select>
        </label>

        <div class="log-sheet-toolbar__auxiliary" id="logSheetAuxiliaryControls" hidden></div>

        <button type="button" class="is-secondary" id="logSheetLoadButton">
          저장자료 불러오기
        </button>

        <button type="button" class="is-primary" id="logSheetSaveButton">
          저장
        </button>

        <button type="button" class="is-secondary" id="logSheetHistoryButton">
          수정 이력
        </button>

        <button type="button" class="is-preview" id="logSheetPreviewButton" aria-expanded="false" disabled>
          미리보기
        </button>

        <button type="button" class="is-excel" id="logSheetDownloadButton">
          엑셀 다운로드
        </button>

        <button type="button" class="is-print" id="logSheetPrintButton">
          바로 인쇄
        </button>
      </div>
    </header>

    <section class="log-sheet-state screen-only" aria-live="polite">
      <span class="log-sheet-state__badge is-idle" id="logSheetStateBadge">
        준비 중
      </span>

      <p id="logSheetStateText">
        원본 엑셀 양식을 불러오고 있습니다.
      </p>

      <small id="logSheetRevisionText">
        저장 기록 없음
      </small>
    </section>

    <nav class="log-sheet-tabs screen-only" id="logSheetTabs" aria-label="Log Sheet 시트 선택" hidden></nav>

    <section class="log-sheet-item-panel screen-only" id="logSheetItemPanel">
      <header class="log-sheet-item-panel__header">
        <div>
          <p>LOGGING ITEMS</p>
<strong>
  Logging 항목
</strong>

<span>
  원본 Excel에 등록된 순서대로 표시됩니다.
</span>
</div>

<div class="log-sheet-item-panel__actions">
  <label
    class="log-sheet-logging-interval"
    id="logSheetLoggingIntervalField"
    hidden
  >
    <span>로깅 주기</span>

    <select
      id="logSheetLoggingInterval"
      aria-label="로깅 시간 주기"
    ></select>
  </label>

  <label
    class="log-sheet-logging-interval"
    id="logSheetLoggingStartField"
    hidden
  >
    <span>시작 시간</span>

    <select
      id="logSheetLoggingStartHour"
      aria-label="로깅 시작 시간"
    ></select>
  </label>

  <button
    type="button"
    id="logSheetItemAddButton"
  >
    + 항목 추가
  </button>

  <button
    type="button"
    class="is-template-save"
    id="logSheetTemplateSaveButton"
  >
    양식 저장
  </button>

  <span
    class="log-sheet-item-panel__count"
    id="logSheetItemCount"
  >
    0개
  </span>
</div>

</header>

      <div class="log-sheet-item-table">
        <div class="log-sheet-item-table__head">
          <span>순서</span>
          <span>상위명</span>
          <span>세부구분</span>
          <span>항목명</span>
          <span>TAG</span>
          <span>RATING</span>
          <span>UNIT</span>
        </div>

        <div class="log-sheet-item-list" id="logSheetItemList">
          <div class="log-sheet-item-list__empty">
            Logging 항목을 불러오고 있습니다.
          </div>
        </div>
      </div>
    </section>

    <section class="log-sheet-document" id="logSheetPreviewSection" hidden>
      <header class="log-sheet-print-heading print-only">
        <strong id="logSheetPrintTitle">Log Sheet</strong>
        <span id="logSheetPrintMeta"></span>
      </header>

      <div
        class="log-sheet-loading"
        id="logSheetLoading"
      >
        <span aria-hidden="true"></span>
        엑셀 양식을 불러오고 있습니다.
      </div>

      <div
        class="log-sheet-grid-shell"
        id="logSheetGridShell"
        hidden
      >
        <div
          class="log-sheet-grid"
          id="logSheetGrid"
        ></div>
      </div>
    </section>
  </main>

  <dialog
    class="log-sheet-history-dialog"
    id="logSheetHistoryDialog"
  >
    <header>
      <div>
        <p>REVISION HISTORY</p>
        <strong>수정 이력</strong>
      </div>

      <button
        type="button"
        id="logSheetHistoryCloseButton"
        aria-label="수정 이력 닫기"
      >
        ×
      </button>
    </header>

    <div
      class="log-sheet-history-list"
      id="logSheetHistoryList"
    >
      저장된 수정 이력이 없습니다.
    </div>
  </dialog>
</body>

</html>
