<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    점검일지
  </title>


  <link
    rel="stylesheet"
    href="inspection-logs.css?v=20260805-inspection-auto-final1"
  >

  <link
    rel="stylesheet"
    href="inspection-calendar.css?v=20260805-inspection-auto-final1"
  >

  <link
    rel="stylesheet"
    href="inspection-navigation.css?v=20260805-inspection-auto-final1"
  >

  <link
    rel="stylesheet"
    href="inspection-view-tools.css?v=20260805-navfix1"
  >


  <script
    src="inspection-logs.js?v=20260805-inspection-auto-final1"
    defer
  ></script>

  <script
    src="inspection-calendar.js?v=20260805-inspection-auto-final1"
    defer
  ></script>

  <script
    src="inspection-navigation.js?v=20260805-inspection-auto-final1"
    defer
  ></script>

  <script
    src="inspection-view-tools.js?v=20260805-navfix1"
    defer
  ></script>

</head>

 <body>
  <main class="inspection-log-hub">
   <header class="inspection-log-header">
    <div class="inspection-log-header__title">
     <p class="inspection-log-header__eyebrow">
      GS SHIFT LOG
     </p>
     <h1>
      점검일지
     </h1>
    </div>
   </header>
   <!-- =====================================================
  월간 달력형 점검 일정
====================================================== -->
   <section class="inspection-calendar-dashboard" hidden="" id="inspectionScheduleDashboard">
    <!-- ===================================================
    월간 달력
  ==================================================== -->
    <section class="inspection-calendar-card">
     <header class="inspection-calendar-toolbar">
      <div class="inspection-calendar-toolbar__title">
       <p>
        INSPECTION CALENDAR
       </p>
       <strong>
        월간 점검 일정
       </strong>
      </div>
      <div class="inspection-calendar-navigation">
       <button aria-label="이전 달" id="inspectionCalendarPreviousButton" type="button">
        &lsaquo;
       </button>
       <button class="inspection-calendar-month-button" disabled="" id="inspectionCalendarTitle" type="button">
        기준 월
       </button>
       <button aria-label="다음 달" id="inspectionCalendarNextButton" type="button">
        &rsaquo;
       </button>
       <button class="inspection-calendar-today-button" id="inspectionCalendarTodayButton" type="button">
        오늘
       </button>
      </div>
     </header>
     <div aria-hidden="true" class="inspection-calendar-weekdays">
      <span>
       일
      </span>
      <span>
       월
      </span>
      <span>
       화
      </span>
      <span>
       수
      </span>
      <span>
       목
      </span>
      <span>
       금
      </span>
      <span>
       토
      </span>
     </div>
     <div aria-label="월간 점검 일정 달력" class="inspection-calendar-grid" id="inspectionCalendarGrid" role="grid">
      <div class="inspection-calendar-empty">
       달력을 준비하고 있습니다.
      </div>
     </div>
    </section>
    <!-- ===================================================
    선택 날짜 점검
  ==================================================== -->
    <section class="inspection-calendar-selected">
     <header class="inspection-calendar-selected__header">
      <div>
       <strong id="inspectionCalendarSelectedTitle">
        선택 날짜
       </strong>
       <span id="inspectionCalendarSelectedSummary">
        점검 일정을 확인하고 있습니다.
       </span>
      </div>
     </header>
     <div class="inspection-calendar-selected-list" id="inspectionCalendarSelectedList">
      <div class="inspection-calendar-empty">
       선택한 날짜의 점검 일정을 불러오고 있습니다.
      </div>
     </div>
    </section>
    <!-- ===================================================
    접이식 점검주기
  ==================================================== -->
    <details class="inspection-calendar-cycle" id="inspectionCalendarCycleDetails">
     <summary>
      <span class="inspection-calendar-cycle__summary-text">
       <strong>
        점검주기
       </strong>
       <small>
        일일&middot;주간&middot;월간&middot;분기 점검 기준 펼쳐보기
       </small>
      </span>
      <span class="inspection-calendar-cycle__count" id="inspectionCalendarCycleCount">
       0
      </span>
     </summary>
     <div class="inspection-calendar-cycle__body">
      <div class="inspection-calendar-cycle__toolbar">
       <select aria-label="점검주기 구분" id="inspectionCalendarCycleCategory">
        <option value="">
         전체 점검주기
        </option>
        <option value="daily">
         일일
        </option>
        <option value="weekly">
         주간
        </option>
        <option value="monthly">
         월간
        </option>
        <option value="quarterly">
         분기
        </option>
        <option value="other">
         기타
        </option>
       </select>
      </div>
      <div class="inspection-calendar-cycle-list" id="inspectionCalendarCycleList">
       <div class="inspection-calendar-empty">
        점검주기를 불러오고 있습니다.
       </div>
      </div>
     </div>
    </details>
   </section>
   <!-- =====================================================
      기존 점검일지 목록

      일일점검일지
      주간점검일지
      월간점검일지
    ====================================================== -->
   <nav aria-label="점검일지 분류" class="inspection-log-tabs">
    <button aria-selected="true" class="inspection-log-tab is-active" data-inspection-category="daily" type="button">
     일일점검일지
    </button>
    <button aria-selected="false" class="inspection-log-tab" data-inspection-category="weekly" type="button">
     주간점검일지
    </button>
    <button aria-selected="false" class="inspection-log-tab" data-inspection-category="monthly" type="button">
     월간점검일지
    </button>
   </nav>
   <section class="inspection-log-list" id="inspectionLogList">
    <!-- 일일점검일지 -->
    <button class="inspection-log-card" data-inspection-category-item="daily" data-inspection-log="night-patrol" data-inspection-path="daily/night-patrol/night-patrol.html?v=20260803-6" type="button">
     <span class="inspection-log-card__icon">
      🌙
     </span>
     <span class="inspection-log-card__text">
      <strong>
       야간 순찰 점검일지
      </strong>
      <small>
       야간 현장 순찰 및 이상 유무 기록
      </small>
     </span>
     <span aria-hidden="true" class="inspection-log-card__arrow">
      &rsaquo;
     </span>
    </button>
    <!-- 주간점검일지 -->
    <button class="inspection-log-card" data-inspection-category-item="weekly" data-inspection-log="high-pressure-gas" data-inspection-path="weekly/high-pressure-gas/high-pressure-gas.html?v=20260804-1" hidden="" type="button">
     <span class="inspection-log-card__icon">
      🧯
     </span>
     <span class="inspection-log-card__text">
      <strong>
       고압가스 저장시설 주간점검표
      </strong>
      <small>
       매주 일요일 D/S &middot; CO2 저장시설 점검
      </small>
     </span>
     <span aria-hidden="true" class="inspection-log-card__arrow">
      &rsaquo;
     </span>
    </button>
    <!-- =====================================================
  LNG 주간점검 일지
====================================================== -->
    <button class="inspection-log-card" data-inspection-category-item="weekly" data-inspection-log="lng-weekly" data-inspection-path="weekly/lng-weekly/lng-weekly.html?v=20260803-1" type="button">
     <span class="inspection-log-card__icon">
      🔥
     </span>
     <span class="inspection-log-card__text">
      <strong>
       LNG System 주간점검 일지
      </strong>
      <small>
       매주 일요일 D/S &middot; LNG 설비 주간점검
      </small>
     </span>
     <span class="inspection-log-card__arrow">
      &rsaquo;
     </span>
    </button>
    <!-- Soot Blower 주간점검일지 -->
    <button class="inspection-log-card" data-inspection-category-item="weekly" data-inspection-log="soot-blower-weekly" data-inspection-path="weekly/soot-blower/soot-blower-weekly.html?v=20260804-1" hidden="" type="button">
     <span class="inspection-log-card__icon">
      ♨️
     </span>
     <span class="inspection-log-card__text">
      <strong>
       Soot Blower 주간점검일지
      </strong>
      <small>
       매주 월요일 N/S &middot; 1&middot;2호기 Soot Blower 점검
      </small>
     </span>
     <span aria-hidden="true" class="inspection-log-card__arrow">
      &rsaquo;
     </span>
    </button>
    <div class="inspection-log-empty" hidden="" id="inspectionLogEmpty">
     등록된 점검일지가 없습니다.
    </div>
   </section>
   <section class="inspection-log-viewer" hidden="" id="inspectionLogViewer">
    <div class="inspection-log-viewer__header">
     <button id="inspectionLogBackButton" type="button">
      &larr; 목록
     </button>
     <strong id="inspectionLogViewerTitle">
      점검일지
     </strong>
    </div>
    <iframe allow="fullscreen" allowfullscreen="" id="inspectionLogFrame" src="about:blank" title="점검일지 화면">
    </iframe>
   </section>
</main>
 </body>
</html>
