<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    점검일지
  </title>


  <link
    rel="stylesheet"
    href="inspection-logs.css?v=20260805-inspection-auto-final1"
  >

  <link
    rel="stylesheet"
    href="inspection-calendar.css?v=20260826-mobile-layout-v17"
  >

  <link
    rel="stylesheet"
    href="inspection-navigation.css?v=20260822-schedule-print-preview2"
  >

  <link
    rel="stylesheet"
    href="inspection-view-tools.css?v=20260821-nav-home1"
  >

  <link rel="stylesheet" href="inspection-hub-modern.css?v=20260821-nav-focus1">

  <link rel="stylesheet" href="inspection-sidebar-redesign.css?v=20260822-logsheet-leaf-no-arrow1">


  <script
    src="inspection-logs.js?v=20260821-nav-home1"
    defer
  ></script>

  <script
    src="inspection-calendar.js?v=20260826-mobile-layout-v17"
    defer
  ></script>

  <script
    src="inspection-navigation.js?v=20260826-mobile-layout-v17"
    defer
  ></script>

  <script
    src="inspection-view-tools.js?v=20260821-nav-home1"
    defer
  ></script>

</head>

 <body>
  <main class="inspection-log-hub">
   <header class="inspection-log-header">
    <div class="inspection-log-header__title">
     <p class="inspection-log-header__eyebrow">
      INSPECTION LOGS
     </p>
     <h1>
      점검일지
     </h1>
    </div>
   </header>
   <!-- =====================================================
  월간 달력형 점검 일정
====================================================== -->
   <section class="inspection-calendar-dashboard" hidden="" id="inspectionScheduleDashboard">
    <!-- ===================================================
    월간 달력
  ==================================================== -->
    <section class="inspection-calendar-card">
     <header class="inspection-calendar-toolbar">
      <div class="inspection-calendar-toolbar__title">
       <p>
        INSPECTION CALENDAR
       </p>
       <strong>
        월간 점검 일정
       </strong>
      </div>
      <div class="inspection-calendar-navigation">
       <button aria-label="이전 달" id="inspectionCalendarPreviousButton" type="button">
        &lsaquo;
       </button>
       <button class="inspection-calendar-month-button" disabled="" id="inspectionCalendarTitle" type="button">
        기준 월
       </button>
       <button aria-label="다음 달" id="inspectionCalendarNextButton" type="button">
        &rsaquo;
       </button>
       <button class="inspection-calendar-today-button" id="inspectionCalendarTodayButton" type="button">
        오늘
       </button>
      </div>
     </header>
     <div aria-hidden="true" class="inspection-calendar-weekdays">
      <span>
       일
      </span>
      <span>
       월
      </span>
      <span>
       화
      </span>
      <span>
       수
      </span>
      <span>
       목
      </span>
      <span>
       금
      </span>
      <span>
       토
      </span>
     </div>
     <div aria-label="월간 점검 일정 달력" class="inspection-calendar-grid" id="inspectionCalendarGrid" role="grid">
      <div class="inspection-calendar-empty">
       달력을 준비하고 있습니다.
      </div>
     </div>
    </section>
    <!-- ===================================================
    선택 날짜 점검
  ==================================================== -->

<!-- ===================================================
  선택 날짜 점검

  월간 달력에서 날짜를 누르면
  해당 날짜의 점검 일정이 간략 카드로 표시된다.
==================================================== -->

<section
  class="inspection-calendar-selected"
  id="inspectionCalendarSelectedSection"
  aria-live="polite"
>

  <header class="inspection-calendar-selected__header">

    <div class="inspection-calendar-selected__heading">

      <p class="inspection-calendar-selected__eyebrow">
        SELECTED DATE
      </p>

      <strong id="inspectionCalendarSelectedTitle">
        선택 날짜
      </strong>

      <span id="inspectionCalendarSelectedSummary">
        날짜를 선택하면 해당 날짜의 점검 일정이 표시됩니다.
      </span>

    </div>


    <div
      class="inspection-calendar-selected__counts"
      aria-label="선택 날짜 점검 현황"
    >

      <span class="is-total">
        전체

        <b id="inspectionCalendarSelectedTotalCount">
          0
        </b>
      </span>


      <span class="is-pending">
        미완료

        <b id="inspectionCalendarSelectedPendingCount">
          0
        </b>
      </span>


      <span class="is-completed">
        완료

        <b id="inspectionCalendarSelectedCompletedCount">
          0
        </b>
      </span>

    </div>

  </header>


  <div
    class="inspection-calendar-selected-list"
    id="inspectionCalendarSelectedList"
  >

    <div class="inspection-calendar-empty">

      날짜를 선택하면 해당 날짜에 수행할 점검이 표시됩니다.

    </div>

  </div>

</section>

    <!-- ===================================================
    접이식 점검주기
  ==================================================== -->
    <details class="inspection-calendar-cycle" id="inspectionCalendarCycleDetails">
     <summary>
      <span class="inspection-calendar-cycle__summary-text">
       <strong>
        점검주기
       </strong>
       <small>
        일일&middot;주간&middot;월간&middot;분기 점검 기준 펼쳐보기
       </small>
      </span>
      <span class="inspection-calendar-cycle__count" id="inspectionCalendarCycleCount">
       0
      </span>
     </summary>
     <div class="inspection-calendar-cycle__body">
      <div class="inspection-calendar-cycle__toolbar">
       <select aria-label="점검주기 구분" id="inspectionCalendarCycleCategory">
        <option value="">
         전체 점검주기
        </option>
        <option value="daily">
         일일
        </option>
        <option value="weekly">
         주간
        </option>
        <option value="monthly">
         월간
        </option>
        <option value="quarterly">
         분기
        </option>
        <option value="other">
         기타
        </option>
       </select>
      </div>
      <div class="inspection-calendar-cycle-list" id="inspectionCalendarCycleList">
       <div class="inspection-calendar-empty">
        점검주기를 불러오고 있습니다.
       </div>
      </div>
     </div>
    </details>
   </section>
   <!-- =====================================================
      기존 점검일지 목록

      일일점검일지
      주간점검일지
      월간점검일지
    ====================================================== -->

   <nav
  aria-label="점검일지 분류"
  class="inspection-log-tabs"
>
  <button
    type="button"
    class="inspection-log-tab is-active"
    data-inspection-category="daily"
    aria-selected="true"
  >
    일일점검일지
  </button>

  <button
    type="button"
    class="inspection-log-tab"
    data-inspection-category="weekly"
    aria-selected="false"
  >
    주간점검일지
  </button>

  <button
    type="button"
    class="inspection-log-tab"
    data-inspection-category="monthly"
    aria-selected="false"
  >
    월간점검일지
  </button>

  <!-- 왼쪽 Log Sheet 메뉴 연결용 숨김 분류 -->
  <button
    type="button"
    class="inspection-log-tab"
    data-inspection-category="log-sheet"
    aria-selected="false"
    hidden
  >
    Log Sheet
  </button>
</nav>

<section
  class="inspection-log-list"
  id="inspectionLogList"
>
  <!-- 일일점검일지 -->
  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="daily"
    data-inspection-log="night-patrol"
    data-inspection-path="daily/night-patrol/night-patrol.html?v=20260803-6"
  >
    <span class="inspection-log-card__icon">
      🌙
    </span>

    <span class="inspection-log-card__text">
      <strong>
        야간 순찰 점검일지
      </strong>

      <small>
        야간 현장 순찰 및 이상 유무 기록
      </small>
    </span>

    <span
      class="inspection-log-card__arrow"
      aria-hidden="true"
    >
      &rsaquo;
    </span>
  </button>

  <!-- 주간점검일지 -->
  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="weekly"
    data-inspection-log="high-pressure-gas"
    data-inspection-path="weekly/high-pressure-gas/high-pressure-gas.html?v=20260804-1"
    hidden
  >
    <span class="inspection-log-card__icon">
      🧯
    </span>

    <span class="inspection-log-card__text">
      <strong>
        고압가스 저장시설 주간점검표
      </strong>

      <small>
        매주 일요일 D/S &middot; CO2 저장시설 점검
      </small>
    </span>

    <span
      class="inspection-log-card__arrow"
      aria-hidden="true"
    >
      &rsaquo;
    </span>
  </button>

  <!-- LNG 주간점검 일지 -->
  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="weekly"
    data-inspection-log="lng-weekly"
    data-inspection-path="weekly/lng-weekly/lng-weekly.html?v=20260803-1"
    hidden
  >
    <span class="inspection-log-card__icon">
      🔥
    </span>

    <span class="inspection-log-card__text">
      <strong>
        LNG System 주간점검 일지
      </strong>

      <small>
        매주 일요일 D/S &middot; LNG 설비 주간점검
      </small>
    </span>

    <span
      class="inspection-log-card__arrow"
      aria-hidden="true"
    >
      &rsaquo;
    </span>
  </button>

  <!-- Soot Blower 주간점검일지 -->
  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="weekly"
    data-inspection-log="soot-blower-weekly"
    data-inspection-path="weekly/soot-blower/soot-blower-weekly.html?v=20260804-1"
    hidden
  >
    <span class="inspection-log-card__icon">
      ♨️
    </span>

    <span class="inspection-log-card__text">
      <strong>
        Soot Blower 주간점검일지
      </strong>

      <small>
        매주 월요일 N/S &middot; 1&middot;2호기 Soot Blower 점검
      </small>
    </span>

    <span
      class="inspection-log-card__arrow"
      aria-hidden="true"
    >
      &rsaquo;
    </span>
  </button>

  <!-- =====================================================
    Log Sheet 공통 편집 화면 연결 레지스트리
    실제 왼쪽 메뉴는 다음 단계에서 생성
  ====================================================== -->

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-integrated-tgo"
    data-inspection-path="log-sheets/log-sheet.html?type=integrated-tgo"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        제어실 Log Sheet · TGO
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-integrated-bco1"
    data-inspection-path="log-sheets/log-sheet.html?type=integrated-bco1"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        제어실 Log Sheet · BCO1
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-integrated-bco2"
    data-inspection-path="log-sheets/log-sheet.html?type=integrated-bco2"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        제어실 Log Sheet · BCO2
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-field-night-leader-to"
    data-inspection-path="log-sheets/log-sheet.html?type=field-night-leader-to"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        현장 Log Sheet · 파트장·TO 야간
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-field-night-bo12"
    data-inspection-path="log-sheets/log-sheet.html?type=field-night-bo12"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        현장 Log Sheet · BO1·2 야간
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-field-day-to"
    data-inspection-path="log-sheets/log-sheet.html?type=field-day-to"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        현장 Log Sheet · TO 주간
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-field-day-bo1"
    data-inspection-path="log-sheets/log-sheet.html?type=field-day-bo1"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        현장 Log Sheet · BO1 주간
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-field-day-bo2"
    data-inspection-path="log-sheets/log-sheet.html?type=field-day-bo2"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        현장 Log Sheet · BO2 주간
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-electrical"
    data-inspection-path="log-sheets/log-sheet.html?type=electrical"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        Elec. Log Sheet
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-aux-control-room"
    data-inspection-path="log-sheets/log-sheet.html?type=aux-control-room"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        고압 Aux BLR 제어실 Log Sheet
      </strong>
    </span>
  </button>

  <button
    type="button"
    class="inspection-log-card"
    data-inspection-category-item="log-sheet"
    data-inspection-log="log-sheet-aux-field"
    data-inspection-path="log-sheets/log-sheet.html?type=aux-field"
    hidden
  >
    <span class="inspection-log-card__text">
      <strong>
        고압 Aux BLR 현장 Log Sheet
      </strong>
    </span>
  </button>

  <div
    class="inspection-log-empty"
    id="inspectionLogEmpty"
    hidden
  >
    등록된 점검일지가 없습니다.
  </div>
</section>

<section
  class="inspection-log-viewer"
  id="inspectionLogViewer"
  hidden
>
  <div class="inspection-log-viewer__header">
    <button
      type="button"
      id="inspectionLogBackButton"
    >
      &larr; 목록
    </button>

    <strong id="inspectionLogViewerTitle">
      점검일지
    </strong>
  </div>

  <iframe
    id="inspectionLogFrame"
    src="about:blank"
    title="점검일지 화면"
    allow="fullscreen"
    allowfullscreen
  ></iframe>
</section>
</main>
 </body>
</html>
