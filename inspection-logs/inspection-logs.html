<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>점검일지</title>

  <link
    rel="stylesheet"
    href="inspection-logs.css?v=20260803-2"
  >

  <script
    src="inspection-logs.js?v=20260803-2"
    defer
  ></script>
</head>

<body>
  <main class="inspection-log-hub">

    <header class="inspection-log-header">
      <div>
        <p class="inspection-log-header__eyebrow">
          GS SHIFT LOG
        </p>

        <h1>
          점검일지
        </h1>
      </div>
    </header>


    <!-- =====================================================
      오늘 점검 및 점검 일정

      기능 연결 전에는 숨김 상태로 유지한다.
      다음 JavaScript 단계에서 날짜에 맞는 점검을 계산하고
      화면을 표시한다.
    ====================================================== -->

    <section
      class="inspection-schedule-dashboard"
      id="inspectionScheduleDashboard"
      hidden
    >

      <!-- ===================================================
        오늘 점검 상단
      ==================================================== -->

      <header class="inspection-today-header">

        <div>

          <p class="inspection-today-header__eyebrow">
            TODAY'S INSPECTION
          </p>

          <h2>
            오늘 점검
          </h2>

          <p
            class="inspection-today-header__date"
            id="inspectionTodayHeaderDate"
          >
            날짜 확인 중
          </p>

        </div>


        <button
          type="button"
          class="inspection-schedule-open-button"
          id="openInspectionScheduleButton"
        >
          전체 점검 일정
        </button>

      </header>


      <!-- ===================================================
        오늘 점검 집계

        예정:
        오늘 수행 대상 전체

        미완료:
        아직 완료 처리되지 않은 점검

        완료:
        완료 처리된 점검

        지연:
        이전 날짜까지 완료되지 않은 점검
      ==================================================== -->

      <div class="inspection-today-summary">

        <article
          class="
            inspection-today-summary-card
            is-total
          "
        >

          <span>
            오늘 예정
          </span>

          <strong id="inspectionTodayTotalCount">
            0
          </strong>

          <small>
            건
          </small>

        </article>


        <article
          class="
            inspection-today-summary-card
            is-pending
          "
        >

          <span>
            미완료
          </span>

          <strong id="inspectionTodayPendingCount">
            0
          </strong>

          <small>
            건
          </small>

        </article>


        <article
          class="
            inspection-today-summary-card
            is-complete
          "
        >

          <span>
            완료
          </span>

          <strong id="inspectionTodayCompletedCount">
            0
          </strong>

          <small>
            건
          </small>

        </article>


        <article
          class="
            inspection-today-summary-card
            is-overdue
          "
        >

          <span>
            지연
          </span>

          <strong id="inspectionTodayOverdueCount">
            0
          </strong>

          <small>
            건
          </small>

        </article>

      </div>


      <!-- ===================================================
        점검 알림

        오늘 미완료 또는 지연 점검이 있을 때 표시한다.
      ==================================================== -->

      <div
        class="inspection-today-alert"
        id="inspectionTodayAlert"
        role="status"
        hidden
      >

        <span
          class="inspection-today-alert__icon"
          aria-hidden="true"
        >
          !
        </span>


        <div>

          <strong>
            점검 알림
          </strong>

          <p id="inspectionTodayAlertText">
          </p>

        </div>

      </div>


      <!-- ===================================================
        오늘 점검 목록

        JavaScript에서 날짜·요일·주차를 계산하여 생성한다.
      ==================================================== -->

      <section class="inspection-today-section">

        <header class="inspection-today-section__header">

          <div>

            <strong>
              오늘 수행할 점검
            </strong>

            <small>
              점검 주기와 근무 기준에 따라 자동 표시됩니다.
            </small>

          </div>

        </header>


        <div
          class="inspection-today-list"
          id="inspectionTodayList"
        >

          <div class="inspection-schedule-loading">

            오늘 점검 일정을 확인하고 있습니다.

          </div>

        </div>

      </section>


      <!-- ===================================================
        전체 점검 일정

        평상시에는 숨기고
        전체 점검 일정 버튼을 누르면 표시한다.
      ==================================================== -->

      <section
        class="inspection-schedule-panel"
        id="inspectionSchedulePanel"
        hidden
      >

        <header class="inspection-schedule-panel__header">

          <div>

            <p>
              INSPECTION SCHEDULE
            </p>

            <h3>
              전체 점검 일정
            </h3>

            <small>
              일간·주간·월간·분기 점검 주기를 확인합니다.
            </small>

          </div>


          <button
            type="button"
            class="inspection-schedule-close-button"
            id="closeInspectionScheduleButton"
          >
            오늘 점검으로 돌아가기
          </button>

        </header>


        <!-- =================================================
          일정 조회 조건
        ================================================== -->

        <div class="inspection-schedule-filters">

          <label>

            <span>
              기준 월
            </span>

            <input
              type="month"
              id="inspectionScheduleMonth"
            >

          </label>


          <label>

            <span>
              점검 구분
            </span>

            <select id="inspectionScheduleCategory">

              <option value="">
                전체
              </option>

              <option value="daily">
                일간
              </option>

              <option value="weekly">
                주간
              </option>

              <option value="monthly">
                월간
              </option>

              <option value="quarterly">
                분기
              </option>

              <option value="other">
                기타
              </option>

            </select>

          </label>

        </div>


        <!-- =================================================
          전체 일정 목록
        ================================================== -->

        <div
          class="inspection-schedule-list"
          id="inspectionScheduleList"
        >

          <div class="inspection-schedule-loading">

            점검 일정을 불러오고 있습니다.

          </div>

        </div>

      </section>

    </section>


    <!-- =====================================================
      기존 점검일지 목록

      일일점검일지
      주간점검일지
      월간점검일지
    ====================================================== -->

    <nav
      class="inspection-log-tabs"
      aria-label="점검일지 분류"
    >
    
      <button
        type="button"
        class="inspection-log-tab is-active"
        data-inspection-category="daily"
        aria-selected="true"
      >
        일일점검일지
      </button>

      <button
        type="button"
        class="inspection-log-tab"
        data-inspection-category="weekly"
        aria-selected="false"
      >
        주간점검일지
      </button>

      <button
        type="button"
        class="inspection-log-tab"
        data-inspection-category="monthly"
        aria-selected="false"
      >
        월간점검일지
      </button>
    </nav>


    <section
      class="inspection-log-list"
      id="inspectionLogList"
    >

      <!-- 일일점검일지 -->
      <button
        type="button"
        class="inspection-log-card"
        data-inspection-log="night-patrol"
        data-inspection-category-item="daily"
        data-inspection-path="daily/night-patrol/night-patrol.html?v=20260803-6"
      >
        <span class="inspection-log-card__icon">
          🌙
        </span>

        <span class="inspection-log-card__text">
          <strong>
            야간 순찰 점검일지
          </strong>

          <small>
            야간 현장 순찰 및 이상 유무 기록
          </small>
        </span>

        <span
          class="inspection-log-card__arrow"
          aria-hidden="true"
        >
          ›
        </span>
      </button>


      <!-- 주간점검일지 -->
      <button
        type="button"
        class="inspection-log-card"
        data-inspection-log="high-pressure-gas"
        data-inspection-category-item="weekly"
        data-inspection-path="weekly/high-pressure-gas/high-pressure-gas.html?v=20260803-7"
        hidden
      >
        <span class="inspection-log-card__icon">
          🧯
        </span>

        <span class="inspection-log-card__text">
          <strong>
            고압가스 저장시설 주간점검표
          </strong>

          <small>
            매주 일요일 D/S · CO2 저장시설 점검
          </small>
        </span>

        <span
          class="inspection-log-card__arrow"
          aria-hidden="true"
        >
          ›
        </span>
      </button>

      <!-- =====================================================
  LNG 주간점검 일지
====================================================== -->

<button
  type="button"
  class="inspection-log-card"
  data-inspection-log="lng-weekly"
  data-inspection-category-item="weekly"
  data-inspection-path="weekly/lng-weekly/lng-weekly.html?v=20260803-1"
>

  <span class="inspection-log-card__icon">
    🔥
  </span>

  <span class="inspection-log-card__text">

    <strong>
      LNG System 주간점검 일지
    </strong>

    <small>
      매주 일요일 D/S · LNG 설비 주간점검
    </small>

  </span>

  <span class="inspection-log-card__arrow">
    ›
  </span>

</button>

<!-- Soot Blower 주간점검일지 -->
<button
  type="button"
  class="inspection-log-card"
  data-inspection-log="soot-blower-weekly"
  data-inspection-category-item="weekly"
  data-inspection-path="weekly/soot-blower/soot-blower-weekly.html?v=20260803-1"
  hidden
>
  <span class="inspection-log-card__icon">
    ♨️
  </span>

  <span class="inspection-log-card__text">
    <strong>
      Soot Blower 주간점검일지
    </strong>

    <small>
      매주 월요일 N/S · 1·2호기 Soot Blower 점검
    </small>
  </span>

  <span
    class="inspection-log-card__arrow"
    aria-hidden="true"
  >
    ›
  </span>
</button>

      <div
        class="inspection-log-empty"
        id="inspectionLogEmpty"
        hidden
      >
        등록된 점검일지가 없습니다.
      </div>
    </section>


    <section
      class="inspection-log-viewer"
      id="inspectionLogViewer"
      hidden
    >
      <div class="inspection-log-viewer__header">
        <button
          type="button"
          id="inspectionLogBackButton"
        >
          ← 목록
        </button>

        <strong id="inspectionLogViewerTitle">
          점검일지
        </strong>
      </div>

      <iframe
        id="inspectionLogFrame"
        title="점검일지 화면"
        src="about:blank"
      ></iframe>
    </section>

  </main>
</body>
</html>
