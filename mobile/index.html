<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta
    name="description"
    content="GS Shift Log mobile login"
  >
  <title>GS Shift Log - Mobile Login</title>

  <style>
    :root {
      color-scheme: light;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        linear-gradient(
          135deg,
          #12385f 0%,
          #1f5f9f 55%,
          #276eae 100%
        );
      color: #172033;
      -webkit-text-size-adjust: 100%;
    }

    .mobile-brand-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .mobile-brand-backdrop__image,
    .mobile-brand-backdrop__shade {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .mobile-brand-backdrop__image {
      display: block;
      object-fit: cover;
      object-position: 50% 50%;
      opacity: 0;
    }

    .mobile-brand-backdrop__image.is-ready {
      opacity: 1;
    }

    .mobile-brand-backdrop__shade {
      background: rgba(
        8,
        25,
        48,
        var(--mobile-brand-overlay, 0.3)
      );
      opacity: 0;
    }

    .mobile-brand-backdrop.has-background
      .mobile-brand-backdrop__shade {
      opacity: 1;
    }

    .screen {
      position: relative;
      z-index: 1;
      display: grid;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding:
        max(18px, env(safe-area-inset-top))
        24px
        max(18px, env(safe-area-inset-bottom));
    }

    .card {
      width: min(100%, 360px);
      padding: 20px 18px 17px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow:
        0 22px 60px
        rgba(9, 32, 58, 0.28);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo {
      display: flex;
      min-width: 42px;
      max-width: 125px;
      height: 42px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
    }

    .logo__fallback {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 10px;
      background:
        linear-gradient(
          135deg,
          #1d5da8,
          #2e79c9
        );
      color: #fff;
      font-size: 14px;
      font-weight: 900;
    }

    .logo__image {
      display: block;
      width: auto;
      max-width: 120px;
      height: 40px;
      object-fit: contain;
      object-position: left center;
    }

    .logo__image[hidden],
    .logo__fallback[hidden] {
      display: none !important;
    }

    .brand-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
    }

    .brand-copy small {
      color: #778396;
      font-size: 9px;
      font-weight: 800;
    }

    .brand-copy strong {
      color: #172033;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.3;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: #1f5fae;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      color: #121c2c;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.16;
      letter-spacing: -0.05em;
    }

    .description {
      margin: 5px 0 15px;
      color: #6f7b8d;
      font-size: 12px;
      font-weight: 650;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label.field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field > span {
      color: #25354d;
      font-size: 13px;
      font-weight: 900;
    }

    .field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #c9d5e2;
      border-radius: 10px;
      background: #fff;
      color: #172033;
      outline: none;
      font: inherit;
      font-size: 16px;
      line-height: 1;
      -webkit-appearance: none;
      appearance: none;
    }

    .field input:focus {
      border-color: #5b91ca;
      box-shadow:
        0 0 0 3px
        rgba(31, 95, 174, 0.12);
    }

    .remember {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 8px;
      min-height: 36px;
      color: #536175;
      font-size: 13px;
      font-weight: 800;
      user-select: none;
      -webkit-user-select: none;
    }

    .remember input {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: #1f5fae;
    }

    .status {
      min-height: 18px;
      margin: -3px 0 0;
      color: #64748b;
      font-size: 11px;
      font-weight: 750;
      line-height: 1.5;
    }

    .status.is-error {
      padding: 10px 11px;
      border: 1px solid #efc4c4;
      border-radius: 8px;
      background: #fff3f3;
      color: #b33d3d;
    }

    .status:empty {
      min-height: 0;
      margin: 0;
    }

    .submit {
      width: 100%;
      height: 46px;
      margin-top: 1px;
      border: 0;
      border-radius: 10px;
      background:
        linear-gradient(
          135deg,
          #2676c8,
          #19579b
        );
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 900;
      touch-action: manipulation;
    }

    .submit:disabled {
      opacity: 0.68;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e0e6ed;
      color: #8a95a4;
      font-size: 10px;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #2ca66d;
      box-shadow:
        0 0 0 3px
        rgba(44, 166, 109, 0.12);
    }

    .launch-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        24px
        max(24px, env(safe-area-inset-bottom));
      background:
        linear-gradient(
          135deg,
          #12385f 0%,
          #1f5f9f 58%,
          #276eae 100%
        );
      color: #fff;
      text-align: center;
    }

    body.is-launching-app .screen {
      visibility: hidden;
    }

    body.is-launching-app .launch-overlay {
      display: grid;
    }

    .launch-overlay__logo {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 15px;
      background: rgba(255,255,255,0.14);
      box-shadow: 0 16px 38px rgba(0,0,0,0.18);
      font-size: 18px;
      font-weight: 900;
    }

    .launch-overlay__logo img {
      display: block;
      width: auto;
      max-width: 54px;
      max-height: 54px;
      object-fit: contain;
    }

    .launch-overlay__logo img[hidden],
    .launch-overlay__logo span[hidden] {
      display: none !important;
    }

    .launch-overlay strong {
      display: block;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.35;
    }

    .launch-overlay p {
      margin: 8px 0 0;
      color: rgba(255,255,255,0.84);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .launch-overlay__spinner {
      width: 28px;
      height: 28px;
      margin: 22px auto 0;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 999px;
      animation: mobile-launch-spin 0.8s linear infinite;
    }

    .launch-overlay__fallback {
      display: none;
      width: min(100%, 320px);
      min-height: 46px;
      margin: 20px auto 0;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.42);
      border-radius: 10px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      -webkit-appearance: none;
      appearance: none;
    }

    body.is-launch-delayed
      .launch-overlay__spinner {
      display: none;
    }

    body.is-launch-delayed
      .launch-overlay__fallback {
      display: flex;
    }

    @keyframes mobile-launch-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .launch-overlay__spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>

<body>
  <!-- MOBILE-BRAND-LOGIN-V16 -->
  <div
    id="mobileV16BrandBackdrop"
    class="mobile-brand-backdrop"
    aria-hidden="true"
  >
    <img
      id="mobileV16BrandBackgroundImage"
      class="mobile-brand-backdrop__image"
      alt=""
      decoding="async"
      fetchpriority="low"
    >

    <div
      id="mobileV16BrandBackgroundShade"
      class="mobile-brand-backdrop__shade"
    ></div>
  </div>

  <!-- MOBILE-LOGIN-ROUTE-V13 -->
  <section
    id="mobileV13LaunchOverlay"
    class="launch-overlay"
    role="status"
    aria-live="polite"
    aria-hidden="true"
  >
    <div>
      <div class="launch-overlay__logo" aria-hidden="true">
        <span id="mobileV16LaunchLogoFallback">
          GS
        </span>

        <img
          id="mobileV16LaunchLogoImage"
          alt=""
          decoding="async"
          fetchpriority="low"
          hidden
        >
      </div>

      <strong>
        모바일 업무일지를 준비하고 있습니다
      </strong>

      <p id="mobileV13LaunchStatus">
        로그인은 완료되었습니다. 화면이 열릴 때까지 잠시만 기다려 주세요.
      </p>

      <div class="launch-overlay__spinner" aria-hidden="true"></div>

      <button
        type="button"
        id="mobileV13LaunchRetryButton"
        class="launch-overlay__fallback"
      >
        모바일 화면 다시 열기
      </button>
    </div>
  </section>

  <main class="screen">
    <section class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <span
            id="mobileV16CardLogoFallback"
            class="logo__fallback"
          >
            GS
          </span>

          <img
            id="mobileV16CardLogoImage"
            class="logo__image"
            alt=""
            decoding="async"
            fetchpriority="low"
            hidden
          >
        </div>

        <div class="brand-copy">
          <small id="mobileV16CompanyName">
            GS 포천그린에너지
          </small>

          <strong id="mobileV16ProgramName">
            GS Shift Log
          </strong>
        </div>
      </div>

      <p class="eyebrow">
        EMPLOYEE LOGIN
      </p>

      <h1>
        로그인
      </h1>

      <p class="description">
        사번과 비밀번호를 입력해 주세요.
      </p>

      <form
        id="mobileV6LoginForm"
        autocomplete="on"
        method="post"
        action="/api/login"
      >
        <label class="field">
          <span>
            사번
          </span>

          <input
            id="mobileV6EmployeeNo"
            name="employeeNo"
            type="text"
            inputmode="numeric"
            maxlength="7"
            autocomplete="username"
            placeholder="사번을 입력하세요"
            required
          >
        </label>

        <label class="field">
          <span>
            비밀번호
          </span>

          <input
            id="mobileV6Password"
            name="password"
            type="password"
            maxlength="30"
            autocomplete="current-password"
            placeholder="비밀번호를 입력하세요"
            required
          >
        </label>

        <label class="remember">
          <input
            id="mobileV6Remember"
            type="checkbox"
          >

          <span>
            자동 로그인
          </span>
        </label>

        <p
          class="status"
          id="mobileV6Status"
          role="status"
          aria-live="polite"
        ></p>

        <button
          id="mobileV6Submit"
          class="submit"
          type="submit"
          disabled
        >
          로그인
        </button>
      </form>

      <footer class="footer">
        <span class="dot" aria-hidden="true"></span>
        <span id="mobileV16SecurityLabel">
          GS Shift Log 모바일 보안 접속
        </span>
      </footer>
    </section>
  </main>

  <script>
    "use strict";

    (() => {
      const AUTH_KEY =
        "gsShiftLog.currentUser";

      const REMEMBER_KEY =
        "gsShiftLog.rememberedLogin";

      let submitting =
        false;

      let interacted =
        false;

      let navigationStarted =
        false;

      let mobileBrandingStarted =
        false;

      let mobileBrandingController =
        null;

      const mobileBrandingTimers =
        new Set();


      function byId(id) {
        return document.getElementById(id);
      }


      function clampMobileBrandNumber(
        value,
        minimum,
        maximum,
        fallback
      ) {
        const numericValue =
          Number(value);

        if (
          !Number.isFinite(
            numericValue
          )
        ) {
          return fallback;
        }

        return Math.min(
          maximum,
          Math.max(
            minimum,
            numericValue
          )
        );
      }


      function normalizeMobileBrandText(
        value,
        fallback,
        maximumLength = 80
      ) {
        const normalized =
          String(
            value ||
            ""
          ).trim();

        return (
          normalized ||
          fallback
        ).slice(
          0,
          maximumLength
        );
      }


      function getSafeMobileBrandAssetUrl(
        rawUrl,
        expectedType
      ) {
        try {
          const url =
            new URL(
              String(
                rawUrl ||
                ""
              ),
              window.location.origin
            );

          if (
            url.origin !==
              window.location.origin ||
            url.pathname !==
              "/api/brand-assets" ||
            url.hash
          ) {
            return "";
          }

          const typeValues =
            url.searchParams.getAll(
              "type"
            );

          if (
            typeValues.length !== 1 ||
            typeValues[0] !==
              expectedType ||
            url.searchParams.getAll(
              "v"
            ).length > 1
          ) {
            return "";
          }

          for (
            const key of
              url.searchParams.keys()
          ) {
            if (
              key !== "type" &&
              key !== "v"
            ) {
              return "";
            }
          }

          return (
            url.pathname +
            url.search
          );

        } catch {
          return "";
        }
      }


      function clearMobileBrandingTimer(
        timerId
      ) {
        window.clearTimeout(
          timerId
        );

        mobileBrandingTimers.delete(
          timerId
        );
      }


      function loadMobileBrandImage(
        image,
        sourceUrl,
        timeoutMs,
        onReady,
        onFailure
      ) {
        if (
          !image ||
          !sourceUrl ||
          navigationStarted
        ) {
          onFailure?.();
          return;
        }

        const requestKey =
          sourceUrl;

        image.dataset.mobileBrandRequest =
          requestKey;

        let timerId =
          0;

        const cleanup =
          () => {
            image.onload =
              null;

            image.onerror =
              null;

            if (timerId) {
              clearMobileBrandingTimer(
                timerId
              );

              timerId =
                0;
            }
          };

        const fail =
          () => {
            if (
              image.dataset
                .mobileBrandRequest !==
                requestKey
            ) {
              return;
            }

            if (
              image.complete &&
              Number(
                image.naturalWidth ||
                0
              ) > 0
            ) {
              cleanup();

              if (!navigationStarted) {
                onReady?.();
              }

              return;
            }

            cleanup();

            image.removeAttribute(
              "src"
            );

            onFailure?.();
          };

        image.onload =
          () => {
            if (
              image.dataset
                .mobileBrandRequest !==
                requestKey
            ) {
              return;
            }

            cleanup();

            if (
              navigationStarted
            ) {
              return;
            }

            onReady?.();
          };

        image.onerror =
          fail;

        timerId =
          window.setTimeout(
            fail,
            timeoutMs
          );

        mobileBrandingTimers.add(
          timerId
        );

        image.src =
          sourceUrl;
      }


      function applyMobileBrandLogo(
        imageId,
        fallbackId,
        logoUrl
      ) {
        const image =
          byId(imageId);

        const fallback =
          byId(fallbackId);

        if (
          !image ||
          !fallback
        ) {
          return;
        }

        image.hidden =
          true;

        image.classList.remove(
          "is-ready"
        );

        image.removeAttribute(
          "src"
        );

        fallback.hidden =
          false;

        if (!logoUrl) {
          return;
        }

        loadMobileBrandImage(
          image,
          logoUrl,
          5000,
          () => {
            image.classList.add(
              "is-ready"
            );

            image.hidden =
              false;

            fallback.hidden =
              true;
          },
          () => {
            image.hidden =
              true;

            fallback.hidden =
              false;
          }
        );
      }


      function applyMobileBrandBackground(
        backgroundUrl,
        positionX,
        positionY,
        overlayPercent
      ) {
        const backdrop =
          byId(
            "mobileV16BrandBackdrop"
          );

        const image =
          byId(
            "mobileV16BrandBackgroundImage"
          );

        const shade =
          byId(
            "mobileV16BrandBackgroundShade"
          );

        if (
          !backdrop ||
          !image ||
          !shade
        ) {
          return;
        }

        image.style.objectPosition =
          `${positionX}% ${positionY}%`;

        shade.style.setProperty(
          "--mobile-brand-overlay",
          String(
            overlayPercent /
            100
          )
        );

        image.classList.remove(
          "is-ready"
        );

        backdrop.classList.remove(
          "has-background"
        );

        image.removeAttribute(
          "src"
        );

        if (!backgroundUrl) {
          return;
        }

        loadMobileBrandImage(
          image,
          backgroundUrl,
          7000,
          () => {
            image.classList.add(
              "is-ready"
            );

            backdrop.classList.add(
              "has-background"
            );
          },
          () => {
            image.classList.remove(
              "is-ready"
            );

            backdrop.classList.remove(
              "has-background"
            );
          }
        );
      }


      async function loadMobileBrandSettings() {
        if (navigationStarted) {
          return;
        }

        const timeout =
          createTimeout(
            4000
          );

        mobileBrandingController =
          timeout.controller;

        try {
          const requestUrl =
            new URL(
              "/api/brand-settings",
              window.location.origin
            );

          requestUrl.searchParams.set(
            "_",
            String(
              Date.now()
            )
          );

          const response =
            await timeout.wait(
              fetch(
                requestUrl.toString(),
                {
                  method:
                    "GET",

                  headers: {
                    Accept:
                      "application/json"
                  },

                  cache:
                    "no-store",

                  signal:
                    timeout
                      .controller
                      .signal
                }
              )
            );

          if (!response.ok) {
            return;
          }

          const result =
            await response.json();

          if (
            navigationStarted ||
            !result ||
            result.ok !== true ||
            !result.brand ||
            typeof result.brand !==
              "object"
          ) {
            return;
          }

          const brand =
            result.brand;

          const companyName =
            normalizeMobileBrandText(
              brand.companyName,
              "GS 포천그린에너지"
            );

          const programName =
            normalizeMobileBrandText(
              brand.programName,
              "GS Shift Log"
            );

          const programSubtitle =
            normalizeMobileBrandText(
              brand.programSubtitle,
              "교대근무 업무일지 시스템",
              120
            );

          const positionX =
            clampMobileBrandNumber(
              brand.backgroundPositionX,
              0,
              100,
              50
            );

          const positionY =
            clampMobileBrandNumber(
              brand.backgroundPositionY,
              0,
              100,
              50
            );

          const overlayPercent =
            clampMobileBrandNumber(
              brand.backgroundOverlay,
              0,
              80,
              30
            );

          const logoUrl =
            getSafeMobileBrandAssetUrl(
              brand.logoUrl,
              "logo"
            );

          const backgroundUrl =
            getSafeMobileBrandAssetUrl(
              brand.backgroundUrl,
              "background"
            );

          byId(
            "mobileV16CompanyName"
          ).textContent =
            companyName;

          byId(
            "mobileV16ProgramName"
          ).textContent =
            programName;

          byId(
            "mobileV16SecurityLabel"
          ).textContent =
            `${programName} 모바일 보안 접속`;

          document.title =
            `${programName} - 로그인`;

          const descriptionMeta =
            document.querySelector(
              'meta[name="description"]'
            );

          descriptionMeta?.setAttribute(
            "content",
            `${programName} - ${programSubtitle}`
          );

          applyMobileBrandLogo(
            "mobileV16CardLogoImage",
            "mobileV16CardLogoFallback",
            logoUrl
          );

          applyMobileBrandLogo(
            "mobileV16LaunchLogoImage",
            "mobileV16LaunchLogoFallback",
            logoUrl
          );

          applyMobileBrandBackground(
            backgroundUrl,
            positionX,
            positionY,
            overlayPercent
          );

        } catch {
          /*
            Brand settings are decorative. Keep the V15 gradient,
            GS fallback, and login controls working on any failure.
          */

        } finally {
          timeout.clear();

          if (
            mobileBrandingController ===
              timeout.controller
          ) {
            mobileBrandingController =
              null;
          }
        }
      }


      function startMobileBranding() {
        if (
          mobileBrandingStarted ||
          navigationStarted ||
          submitting
        ) {
          return;
        }

        mobileBrandingStarted =
          true;

        const start =
          () => {
            if (!navigationStarted) {
              void loadMobileBrandSettings();
            }
          };

        if (
          typeof window.requestAnimationFrame ===
            "function"
        ) {
          window.requestAnimationFrame(
            start
          );

        } else {
          window.setTimeout(
            start,
            0
          );
        }
      }


      function stopMobileBrandingPending() {
        mobileBrandingStarted =
          false;

        mobileBrandingController
          ?.abort();

        mobileBrandingController =
          null;

        for (
          const timerId of
            mobileBrandingTimers
        ) {
          window.clearTimeout(
            timerId
          );
        }

        mobileBrandingTimers.clear();

        [
          "mobileV16BrandBackgroundImage",
          "mobileV16CardLogoImage",
          "mobileV16LaunchLogoImage"
        ].forEach(
          id => {
            const image =
              byId(id);

            if (
              !image ||
              image.classList.contains(
                "is-ready"
              )
            ) {
              return;
            }

            image.onload =
              null;

            image.onerror =
              null;

            image.removeAttribute(
              "src"
            );
          }
        );
      }


      function createTimeout(ms) {
        const controller =
          new AbortController();

        const timeoutMarker = {};

        let resolveTimeout;

        const timeoutPromise =
          new Promise(
            resolve => {
              resolveTimeout =
                resolve;
            }
          );

        const timeoutId =
          window.setTimeout(
            () => {
              controller.abort();

              resolveTimeout(
                timeoutMarker
              );
            },
            ms
          );

        return {
          controller,

          async wait(promise) {
            const result =
              await Promise.race([
                promise,
                timeoutPromise
              ]);

            if (
              result ===
                timeoutMarker
            ) {
              const error =
                new Error(
                  "Request timeout"
                );

              error.name =
                "AbortError";

              throw error;
            }

            return result;
          },

          clear() {
            window.clearTimeout(
              timeoutId
            );
          }
        };
      }


      function getToken(user) {
        if (
          !user ||
          typeof user !== "object"
        ) {
          return "";
        }

        return String(
          user.sessionToken ||
          user.session_token ||
          ""
        ).trim();
      }


      function readStoredUser() {
        try {
          const raw =
            localStorage.getItem(
              AUTH_KEY
            );

          if (!raw) {
            return null;
          }

          const user =
            JSON.parse(raw);

          return (
            user &&
            typeof user === "object"
          )
            ? user
            : null;

        } catch {
          localStorage.removeItem(
            AUTH_KEY
          );

          return null;
        }
      }


      function setStatus(
        message,
        isError = false
      ) {
        const element =
          byId(
            "mobileV6Status"
          );

        element.textContent =
          String(
            message ||
            ""
          );

        element.classList.toggle(
          "is-error",
          Boolean(isError)
        );
      }


      function setBusy(isBusy) {
        const button =
          byId(
            "mobileV6Submit"
          );

        button.disabled =
          Boolean(isBusy);

        button.textContent =
          isBusy
            ? "로그인 확인 중..."
            : "로그인";
      }


      async function validateUser(
        user,
        timeoutMs = 8000
      ) {
        const token =
          getToken(user);

        if (!token) {
          return "invalid";
        }

        const timeout =
          createTimeout(
            timeoutMs
          );

        try {
          const response =
            await timeout.wait(
              fetch(
                "/api/login",
                {
                  method:
                    "GET",

                  headers: {
                    Accept:
                      "application/json",

                    Authorization:
                      "Bearer " +
                      token
                  },

                  cache:
                    "no-store",

                  signal:
                    timeout
                      .controller
                      .signal
                }
              )
            );

          if (
            response.status ===
              401 ||
            response.status ===
              403
          ) {
            return "invalid";
          }

          if (!response.ok) {
            return "unavailable";
          }

          const result =
            await response.json();

          return (
            result &&
            result.ok === true &&
            result.authenticated === true
          )
            ? "valid"
            : "invalid";

        } catch {
          return "unavailable";

        } finally {
          timeout.clear();
        }
      }


      async function requestLogin(
        employeeNo,
        password
      ) {
        const timeout =
          createTimeout(
            15000
          );

        try {
          const response =
            await timeout.wait(
              fetch(
                "/api/login",
                {
                  method:
                    "POST",

                  headers: {
                    "Content-Type":
                      "application/json",

                    Accept:
                      "application/json"
                  },

                  cache:
                    "no-store",

                  body:
                    JSON.stringify({
                      employeeNo,
                      password
                    }),

                  signal:
                    timeout
                      .controller
                      .signal
                }
              )
            );

          const responseText =
            await response.text();

          let result = {};

          try {
            result =
              responseText
                ? JSON.parse(
                    responseText
                  )
                : {};

          } catch {
            throw new Error(
              "로그인 서버 응답을 확인할 수 없습니다."
            );
          }

          if (
            !response.ok ||
            !result ||
            result.ok !== true
          ) {
            throw new Error(
              (
                result &&
                result.message
              ) ||
              "사번 또는 비밀번호를 확인해 주세요."
            );
          }

          const user =
            result.user ||
            result.member ||
            result.data ||
            null;

          if (
            !user ||
            typeof user !== "object"
          ) {
            throw new Error(
              "로그인 사용자 정보를 확인할 수 없습니다."
            );
          }

          if (!getToken(user)) {
            throw new Error(
              "로그인 세션 토큰을 발급받지 못했습니다."
            );
          }

          return user;

        } catch (error) {
          if (
            error &&
            error.name ===
              "AbortError"
          ) {
            throw new Error(
              "로그인 서버 응답이 지연되고 있습니다. 잠시 후 다시 시도해 주세요."
            );
          }

          throw error;

        } finally {
          timeout.clear();
        }
      }


      function restoreRemembered() {
        try {
          const raw =
            localStorage.getItem(
              REMEMBER_KEY
            );

          if (!raw) {
            return;
          }

          const saved =
            JSON.parse(raw);

          const employeeNo =
            String(
              (
                saved &&
                saved.employeeId
              ) ||
              ""
            ).trim();

          const password =
            String(
              (
                saved &&
                saved.password
              ) ||
              ""
            );

          if (
            !employeeNo ||
            !password
          ) {
            return;
          }

          byId(
            "mobileV6EmployeeNo"
          ).value =
            employeeNo;

          byId(
            "mobileV6Password"
          ).value =
            password;

          byId(
            "mobileV6Remember"
          ).checked =
            true;

        } catch {
          localStorage.removeItem(
            REMEMBER_KEY
          );
        }
      }


      function goToApp() {
        if (navigationStarted) {
          return;
        }

        navigationStarted =
          true;

        stopMobileBrandingPending();

        const overlay =
          byId(
            "mobileV13LaunchOverlay"
          );

        document.body.classList.add(
          "is-launching-app"
        );

        if (overlay) {
          overlay.setAttribute(
            "aria-hidden",
            "false"
          );
        }

        setBusy(true);

        setStatus(
          "로그인 완료. 모바일 업무일지를 준비하고 있습니다."
        );

        const destination =
          "/mobile-app/?build=20260826-mobile-layout-v17";

        window.setTimeout(
          () => {
            if (
              !document.body.classList
                .contains(
                  "is-launching-app"
                )
            ) {
              return;
            }

            document.body.classList.add(
              "is-launch-delayed"
            );

            const launchStatus =
              byId(
                "mobileV13LaunchStatus"
              );

            if (launchStatus) {
              launchStatus.textContent =
                "화면 준비가 지연되고 있습니다. 아래 버튼으로 다시 열 수 있습니다.";
            }
          },
          15000
        );

        const navigate =
          () => {
            window.location.replace(
              destination
            );
          };

        /*
          상태 변경을 실제로 한 번 그린 뒤 이동한다.
          iOS 인앱 브라우저가 무거운 다음 문서를 여는 동안에도
          이전 로그인 화면이 멈춘 것처럼 남지 않게 한다.
        */
        if (
          typeof window.requestAnimationFrame ===
            "function"
        ) {
          window.requestAnimationFrame(
            () => {
              window.requestAnimationFrame(
                navigate
              );
            }
          );

        } else {
          window.setTimeout(
            navigate,
            40
          );
        }
      }


      async function handleSubmit(event) {
        event.preventDefault();

        if (submitting) {
          return;
        }

        interacted =
          true;

        const employeeNo =
          String(
            byId(
              "mobileV6EmployeeNo"
            ).value ||
            ""
          ).trim();

        const password =
          String(
            byId(
              "mobileV6Password"
            ).value ||
            ""
          );

        const remember =
          byId(
            "mobileV6Remember"
          );

        if (!employeeNo) {
          setStatus(
            "사번을 입력해 주세요.",
            true
          );

          byId(
            "mobileV6EmployeeNo"
          ).focus();

          return;
        }

        if (!password) {
          setStatus(
            "비밀번호를 입력해 주세요.",
            true
          );

          byId(
            "mobileV6Password"
          ).focus();

          return;
        }

        stopMobileBrandingPending();

        submitting =
          true;

        setBusy(true);

        setStatus(
          "로그인 정보를 확인하고 있습니다."
        );

        try {
          const user =
            await requestLogin(
              employeeNo,
              password
            );

          if (
            remember &&
            remember.checked
          ) {
            localStorage.setItem(
              REMEMBER_KEY,
              JSON.stringify({
                employeeId:
                  employeeNo,

                password,

                savedAt:
                  new Date()
                    .toISOString()
              })
            );

          } else {
            localStorage.removeItem(
              REMEMBER_KEY
            );
          }

          localStorage.setItem(
            AUTH_KEY,
            JSON.stringify(user)
          );

          setStatus(
            "로그인 완료. 업무일지를 여는 중입니다."
          );

          /*
            POST /api/login already waits until the new session is
            stored and returns only after a token is issued.

            Do not block a fresh mobile login on a second GET. That
            extra round trip was unique to mobile and could keep the
            button in its busy state on a slow network or under D1
            write contention. Existing stored sessions are still
            validated by validateStoredInBackground().
          */
          goToApp();

        } catch (error) {
          submitting =
            false;

          startMobileBranding();

          setBusy(false);

          setStatus(
            (
              error &&
              error.message
            ) ||
            "로그인에 실패했습니다.",
            true
          );
        }
      }


      async function validateStoredInBackground() {
        const storedUser =
          readStoredUser();

        if (!storedUser) {
          return;
        }

        const checkedToken =
          getToken(storedUser);

        if (!checkedToken) {
          localStorage.removeItem(
            AUTH_KEY
          );

          return;
        }

        setStatus(
          "기존 로그인 세션을 확인하고 있습니다. 최대 6초 정도 걸릴 수 있습니다."
        );

        const validation =
          await validateUser(
            storedUser,
            6000
          );

        if (
          validation ===
            "valid" &&
          !interacted &&
          !submitting
        ) {
          setStatus(
            "기존 로그인 확인 완료. 업무일지를 여는 중입니다."
          );

          goToApp();

          return;
        }

        if (
          validation ===
            "valid"
        ) {
          startMobileBranding();
          return;
        }

        if (
          validation ===
            "invalid"
        ) {
          const latestUser =
            readStoredUser();

          if (
            getToken(
              latestUser
            ) === checkedToken
          ) {
            localStorage.removeItem(
              AUTH_KEY
            );
          }

          if (!interacted) {
            setStatus("");
          }

          startMobileBranding();

          return;
        }

        if (
          validation ===
            "unavailable" &&
          !interacted
        ) {
          setStatus(
            "기존 세션 확인이 지연되고 있습니다. 필요하면 로그인 버튼을 눌러 다시 시도해 주세요."
          );
        }

        if (
          validation ===
            "unavailable"
        ) {
          startMobileBranding();
        }
      }


      function initialize() {
        const form =
          byId(
            "mobileV6LoginForm"
          );

        form.addEventListener(
          "submit",
          handleSubmit
        );

        setBusy(false);

        byId(
          "mobileV13LaunchRetryButton"
        )?.addEventListener(
          "click",
          () => {
            window.location.replace(
              "/mobile-app/?build=20260826-mobile-layout-v17"
            );
          }
        );

        [
          byId(
            "mobileV6EmployeeNo"
          ),

          byId(
            "mobileV6Password"
          ),

          byId(
            "mobileV6Remember"
          )
        ]
          .filter(Boolean)
          .forEach(
            element => {
              element.addEventListener(
                "input",
                () => {
                  interacted =
                    true;

                  startMobileBranding();
                }
              );

              element.addEventListener(
                "focus",
                () => {
                  interacted =
                    true;

                  startMobileBranding();
                }
              );
            }
          );

        byId(
          "mobileV6Remember"
        ).addEventListener(
          "change",
          event => {
            interacted =
              true;

            startMobileBranding();

            if (
              !event.currentTarget
                .checked
            ) {
              localStorage.removeItem(
                REMEMBER_KEY
              );
            }
          }
        );

        restoreRemembered();

        const storedUser =
          readStoredUser();

        if (
          !getToken(
            storedUser
          )
        ) {
          startMobileBranding();
        }

        void validateStoredInBackground();
      }


      window.addEventListener(
        "pagehide",
        () => {
          stopMobileBrandingPending();
        }
      );

      window.addEventListener(
        "pageshow",
        event => {
          if (
            event.persisted &&
            !navigationStarted
          ) {
            startMobileBranding();
          }
        }
      );


      window.addEventListener(
        "error",
        event => {
          setStatus(
            "모바일 로그인 화면 오류: " +
            String(
              event.message ||
              "알 수 없는 오류"
            ),
            true
          );
        }
      );

      window.addEventListener(
        "unhandledrejection",
        event => {
          const reason =
            event.reason;

          setStatus(
            "모바일 로그인 처리 오류: " +
            String(
              reason &&
              reason.message
                ? reason.message
                : reason ||
                  "알 수 없는 오류"
            ),
            true
          );
        }
      );

      if (
        document.readyState ===
          "loading"
      ) {
        document.addEventListener(
          "DOMContentLoaded",
          initialize,
          {
            once:
              true
          }
        );

      } else {
        initialize();
      }
    })();
  </script>
</body>
</html>
